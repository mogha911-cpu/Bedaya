<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وجرد المخبز البلدي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            background: #bdc3c7;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #2c3e50;
        }
        .section-content {
            display: none;
        }
        .section-content.active {
            display: block;
        }
        .section-title {
            background: #27ae60;
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 15px;
            margin-top: 15px;
            margin-bottom: 10px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 16px;
        }
        .result-box {
            margin-top: 15px;
            background: #e8f8f5;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #a3e4d7;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 15px;
            color: #117a65;
            line-height: 1.5;
        }
        .result-item span {
            font-weight: bold;
            color: #0e6251;
        }
        .btn {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #2471a3;
        }
        .btn-edit {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }
        .btn-delete {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .history-section {
            margin-top: 20px;
            border-top: 2px solid #ecf0f1;
            padding-top: 10px;
        }
        .history-card {
            background: #fdfefe;
            border: 1px solid #d5dbdb;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حسابات وجرد المخبز</h2>

    <!-- أزرار التنقل -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('general')" id="btnGeneral">دفتر الحسابات العام</button>
        <button class="tab-btn" onclick="switchTab('dough')" id="btnDough">جرد العجين</button>
    </div>

    <!-- القسم الأول: دفتر الحسابات العام -->
    <div id="generalSection" class="section-content active">
        <div class="form-group">
            <label for="genDate">التاريخ:</label>
            <input type="date" id="genDate">
        </div>
        <div class="form-group">
            <label for="openingBalance">الرصيد الافتتاحي (أرغفة المخبز):</label>
            <input type="number" id="openingBalance" placeholder="رصيد أول اليوم بالرغيف" oninput="calcGeneral()">
        </div>
        <div class="form-group">
            <label for="todaySales">مبيعات اليوم (الأرغفة المباعة):</label>
            <input type="number" id="todaySales" placeholder="الأرغفة اللي اتباعت" oninput="calcGeneral()">
        </div>

        <div class="result-box">
            <div class="result-item">• تفصيل الرصيد الافتتاحي: <br><span id="genOpeningDetail">0</span></div>
            <hr style="border: 0; border-top: 1px dashed #a3e4d7; margin: 8px 0;">
            <div class="result-item">• تفصيل مبيعات اليوم: <br><span id="genSalesDetail">0</span></div>
        </div>
        
        <button class="btn" id="saveBtn" onclick="saveGeneral()">حفظ اليومية 💾</button>

        <div class="history-section">
            <h3>السجلات المحفوظة</h3>
            <div id="genHistoryList">لا توجد سجلات.</div>
        </div>
    </div>

    <!-- القسم الثاني: جرد العجين الجديد -->
    <div id="doughSection" class="section-content">
        <div class="section-title">حساب الشكاير المعجونة بدقة</div>

        <div class="form-group">
            <label for="doughBalance">رصيد المخبز (أو الرصيد الحالي بالأرغفة):</label>
            <input type="number" id="doughBalance" placeholder="أدخل رصيد الأرغفة" oninput="calcDough()">
        </div>

        <div class="form-group">
            <label for="doughRawSacks">عدد شكاير الدقيق الخام (السليمة):</label>
            <input type="number" id="doughRawSacks" placeholder="أدخل عدد الشكاير الخام" oninput="calcDough()">
        </div>

        <div class="result-box" style="text-align: center;">
            <div class="result-item" style="font-size: 18px;">
                🍞 <b>عدد الشكاير المعجونة:</b><br>
                <span id="doughResult" style="font-size: 24px; color: #117a65;">0 شيكارة</span>
            </div>
        </div>
    </div>

</div>

<script>
    document.getElementById('genDate').valueAsDate = new Date();
    loadGeneralHistory();

    function switchTab(tab) {
        document.getElementById('generalSection').classList.remove('active');
        document.getElementById('doughSection').classList.remove('active');
        document.getElementById('btnGeneral').classList.remove('active');
        document.getElementById('btnDough').classList.remove('active');

        if(tab === 'general') {
            document.getElementById('generalSection').classList.add('active');
            document.getElementById('btnGeneral').classList.add('active');
        } else {
            document.getElementById('doughSection').classList.add('active');
            document.getElementById('btnDough').classList.add('active');
        }
    }

    function calcGeneral() {
        let opening = parseFloat(document.getElementById('openingBalance').value) || 0;
        let sales = parseFloat(document.getElementById('todaySales').value) || 0;

        function formatSacksAndBreakdown(totalRagheef) {
            let sacks = Math.floor(totalRagheef / 725);
            let leftover = totalRagheef % 725;
            let needed = leftover === 0 ? 0 : (725 - leftover);
            
            let text = sacks + " شيكارة (" + (sacks * 725) + " رغيف)";
            if(leftover > 0) {
                text += " + " + leftover + " رغيف زيادة <br><span style='color:#c0392b; font-size:13px;'>⚠️ يلزمك <b>" + needed + " رغيف</b> لتقفيل الشيكارة التالية بالكامل.</span>";
            } else {
                text += " <span style='color:#27ae60; font-size:13px;'>✅ مضبوطة تماماً بدون أي كسور.</span>";
            }
            return text;
        }

        document.getElementById('genOpeningDetail').innerHTML = formatSacksAndBreakdown(opening);
        document.getElementById('genSalesDetail').innerHTML = formatSacksAndBreakdown(sales);
    }

    function saveGeneral() {
        let date = document.getElementById('genDate').value;
        let opening = document.getElementById('openingBalance').value || 0;
        let sales = document.getElementById('todaySales').value || 0;
        if(!date) { alert('حدد التاريخ'); return; }

        let history = JSON.parse(localStorage.getItem('gen_history')) || [];
        
        // التحقق إذا كان التاريخ موجود مسبقاً لتعديله أو إضافته جديد
        let existingIndex = history.findIndex(i => i.date === date);
        if(existingIndex >= 0) {
            history[existingIndex] = { date, opening, sales };
            alert('تم تحديث اليومية بنجاح! 🔄');
        } else {
            history.unshift({ date, opening, sales });
            alert('تم حفظ اليومية بنجاح! 💾');
        }

        localStorage.setItem('gen_history', JSON.stringify(history));
        loadGeneralHistory();
    }

    function loadGeneralHistory() {
        let history = JSON.parse(localStorage.getItem('gen_history')) || [];
        let list = document.getElementById('genHistoryList');
        if(history.length === 0) { list.innerHTML = 'لا توجد سجلات.'; return; }
        
        let html = '';
        history.forEach((i, index) => {
            let final = i.opening - i.sales;
            html += `<div class="history-card">
                <div><b>التاريخ: ${i.date}</b><br>افتتاحي: ${i.opening} | مبيعات: ${i.sales} | النهائي: ${final} رغيف</div>
                <div>
                    <button class="btn-edit" onclick="editRecord('${i.date}', ${i.opening}, ${i.sales})">تعديل</button>
                    <button class="btn-delete" onclick="deleteRecord(${index})">حذف</button>
                </div>
            </div>`;
        });
        list.innerHTML = html;
    }

    function editRecord(date, opening, sales) {
        document.getElementById('genDate').value = date;
        document.getElementById('openingBalance').value = opening;
        document.getElementById('todaySales').value = sales;
        calcGeneral();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteRecord(index) {
        if(confirm('هل أنت متأكد من حذف هذا السجل؟')) {
            let history = JSON.parse(localStorage.getItem('gen_history')) || [];
            history.splice(index, 1);
            localStorage.setItem('gen_history', JSON.stringify(history));
            loadGeneralHistory();
        }
    }

    // حساب جرد العجين (الرصيد ÷ 725 - الشكاير الخام)
    function calcDough() {
        let balance = parseFloat(document.getElementById('doughBalance').value) || 0;
        let rawSacks = parseFloat(document.getElementById('doughRawSacks').value) || 0;

        let kneadedSacks = (balance / 725) - rawSacks;
        document.getElementById('doughResult').innerText = kneadedSacks.toFixed(2) + " شيكارة معجونة";
    }
</script>

</body>
</html>
